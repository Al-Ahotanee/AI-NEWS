services:
  - type: web
    name: signaldesk
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
  - type: cron
    name: signaldesk-fetch-news
    env: docker
    schedule: "*/30 * * * *"
    dockerfilePath: ./Dockerfile
    command: "php -r \"require 'app/config/bootstrap.php'; require 'app/services/NewsService.php'; NewsService::fetchAll();\""
    envVars:
      - key: DATABASE_URL
        sync: false
